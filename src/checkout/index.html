<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sleep Outside | Checkout</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/checkout.js" type="module"></script>
  </head>

  <body>
    <header class="divider" id="main-header"></header>

    <main class="divider">
      <section class="products">
        <h2>Review & Place your Order</h2>
      </section>

      <section class="order-summary">
        <h3>Order Summary</h3>
        <ul class="product-list cart-list"></ul>
        <div class="cart-footer">
          <p>
            <span class="cart-items">Items: 0</span><br />
            <span class="cart-subtotal">Subtotal: $0.00</span><br />
            <span class="cart-tax">Tax: $0.00</span><br />
            <span class="cart-shipping">Shipping: $0.00</span><br />
            <span class="order-total">Order Total: $0.00</span><br />
            <small class="checkout-note"
              >*Tax and shipping are calculated after entering zip code</small
            >
          </p>
        </div>
      </section>

      <form class="checkout-form" id="checkout-form">
        <div class="form-group">
          <h3>Personal Information</h3>
          <label for="name">First Name:</label>
          <input type="text" id="name" name="fname" required />
          <label for="last-name">Last Name:</label>
          <input type="text" id="last-name" name="lname" required />
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <h3>Billing & Shipping Information</h3>
          <label for="street">Street Address:</label>
          <input type="text" id="street" name="street" required />
          <label for="city">City:</label>
          <input type="text" id="city" name="city" required />
          <label for="state">State:</label>
          <input type="text" id="state" name="state" required />
          <label for="zip">Zip Code:</label>
          <input
            type="text"
            id="zip"
            name="zip"
            pattern="\d{5}(-\d{4})?"
            required
          />
        </div>

        <div class="form-group">
          <h3>Payment Information</h3>
          <label for="credit-card">Card Number:</label>
          <input
            type="text"
            id="credit-card"
            name="cardNumber"
            inputmode="numeric"
            pattern="[0-9\s]{13,23}"
            maxlength="23"
            required
          />
          <label for="expiration">Expiration Date:</label>
          <input
            type="text"
            id="expiration"
            name="expiration"
            pattern="\d{2}/\d{2}"
            placeholder="MM/YY"
            required
          />
          <label for="cvv">Security Code:</label>
          <input
            type="text"
            id="cvv"
            name="cvv"
            inputmode="numeric"
            pattern="\d{3,4}"
            maxlength="4"
            required
          />
        </div>

        <button type="submit">Place Order</button>
      </form>
    </main>

    <footer id="main-footer"></footer>
  </body>
</html>
